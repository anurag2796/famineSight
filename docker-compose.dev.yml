version: "3.9"
networks:
  faminesight_net:
    driver: bridge

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: faminesight_backend
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
    env_file: [.env]
    environment:
      - RF_N_JOBS=4
      - XGB_DEVICE=cpu
    networks: [faminesight_net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: faminesight_frontend
    ports: ["8501:8501"]
    volumes: [./src:/app/src]
    env_file: [.env]
    environment:
      - BACKEND_URL=http://backend:8000
    networks: [faminesight_net]
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  # Development Ollama service (smaller model)
  ollama-dev:
    image: ollama/ollama:latest
    container_name: faminesight_ollama_dev
    ports: ["11434:11434"]
    volumes:
      - ./ollama-data:/root/.ollama
    command: serve
    networks: [faminesight_net]
    deploy:
      resources:
        limits:
          memory: 2G